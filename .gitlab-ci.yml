variables:
  DOCKER_TLS_CERTDIR: ""
  DOCKER_HOST: tcp://docker:2375
  LEARNINGS_REQUIRED_ON_COMPLETE: "true"

default:
  image: docker:24
  services:
    - name: docker:24-dind
      alias: docker
      command: ["--tls=false"]

stages:
  - build
  - test

.pipeline-rules: &pipeline-rules
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: always
    - if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "dev"
      when: always

.wait-for-ready: &wait-for-ready |
  echo "Waiting for backend /ready (max 180s)..."
  for i in $(seq 1 36); do
    if docker compose --profile test exec -T backend python -c "import urllib.request; urllib.request.urlopen('http://localhost:80/ready')" 2>/dev/null; then
      echo "Backend is ready."
      exit 0
    fi
    echo "Attempt $i/36: not ready yet, waiting 5s..."
    sleep 5
  done
  echo "Backend did not become ready in time."
  docker compose --profile test logs backend || true
  exit 1

build-images:
  stage: build
  timeout: 10m
  script:
    - docker compose --profile test build backend tests
  <<: *pipeline-rules

run-tests:
  stage: test
  timeout: 20m
  needs: ["build-images"]
  before_script:
    - mkdir -p .ci-artifacts
    - docker compose --profile test up -d postgres backend
    - *wait-for-ready
  script:
    - docker compose --profile test run --name ci_tests_runner -v "$CI_PROJECT_DIR/.ci-artifacts:/ci-artifacts" tests sh -c "python /app/tests/seed_test_data.py && pytest /app/tests/ -s -vv --junitxml=/ci-artifacts/junit.xml"
  after_script:
    - docker compose --profile test logs backend || true
    - docker rm -f ci_tests_runner || true
    - docker compose --profile test down -v
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - .ci-artifacts/junit.xml
    reports:
      junit: .ci-artifacts/junit.xml
  <<: *pipeline-rules
