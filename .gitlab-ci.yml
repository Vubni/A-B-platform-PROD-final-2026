variables:
  DOCKER_TLS_CERTDIR: ""
  DOCKER_HOST: tcp://docker:2375
  LEARNINGS_REQUIRED_ON_COMPLETE: "true"

default:
  image: docker:24
  services:
    - name: docker:24-dind
      alias: docker
      command: ["--tls=false"]

stages:
  - build
  - test
  - report

.pipeline-rules: &pipeline-rules
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: always
    - if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "dev"
      when: always

.wait-for-ready: &wait-for-ready |
  echo "Waiting for backend /ready (max 180s)..."
  for i in $(seq 1 36); do
    if docker compose --profile test exec -T backend python -c "import urllib.request; urllib.request.urlopen('http://localhost:80/ready')" 2>/dev/null; then
      echo "Backend is ready."
      exit 0
    fi
    echo "Attempt $i/36: not ready yet, waiting 5s..."
    sleep 5
  done
  echo "Backend did not become ready in time."
  docker compose --profile test logs backend || true
  exit 1

build-images:
  stage: build
  timeout: 10m
  script:
    - docker compose --profile test build backend tests
  <<: *pipeline-rules

run-tests:
  stage: test
  timeout: 20m
  needs: ["build-images"]
  before_script:
    - mkdir -p .ci-artifacts
    - docker compose --profile test up -d postgres backend
    - *wait-for-ready
  script:
    - docker compose --profile test run --name ci_tests_runner -v "$CI_PROJECT_DIR/.ci-artifacts:/ci-artifacts" tests sh -c "python /app/tests/seed_test_data.py && pytest /app/tests/ -s -vv --junitxml=/ci-artifacts/junit.xml"
  after_script:
    - docker compose --profile test logs backend || true
    - docker rm -f ci_tests_runner || true
    - docker compose --profile test down -v
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - .ci-artifacts/junit.xml
  <<: *pipeline-rules

.report-template:
  stage: report
  image: python:3.12-alpine
  when: always
  needs: ["run-tests"]
  script:
    - |
      python - <<'PY'
      import os
      import xml.etree.ElementTree as ET

      shard = int(os.environ["REPORT_SHARD"])
      total_shards = 3
      junit_path = ".ci-artifacts/junit.xml"

      tree = ET.parse(junit_path)
      root = tree.getroot()

      tests = []
      for suite in root.iter("testsuite"):
          for case in suite.findall("testcase"):
              tests.append(case)

      if not tests:
          print("No tests found in junit report.")
          raise SystemExit(1)

      print(f"Report shard {shard + 1}/{total_shards}")
      print("-" * 70)

      selected = 0
      failed = 0
      for idx, case in enumerate(tests):
          if idx % total_shards != shard:
              continue
          selected += 1
          classname = case.attrib.get("classname", "")
          name = case.attrib.get("name", "unknown_test")
          title = f"{classname}::{name}" if classname else name
          failure = case.find("failure")
          error = case.find("error")
          skipped = case.find("skipped")
          if failure is not None or error is not None:
              failed += 1
              reason = (failure or error).attrib.get("message", "failed")
              reason = reason.replace("\n", " ").strip()
              print(f"[FAIL] {title} | {reason}")
          elif skipped is not None:
              reason = skipped.attrib.get("message", "skipped").replace("\n", " ").strip()
              print(f"[SKIP] {title} | {reason}")
          else:
              print(f"[PASS] {title}")

      print("-" * 70)
      print(f"Shard tests: {selected}")
      print(f"Shard failures: {failed}")
      PY
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - .ci-artifacts/junit.xml
  <<: *pipeline-rules

report-tests-1:
  extends: .report-template
  variables:
    REPORT_SHARD: "0"

report-tests-2:
  extends: .report-template
  variables:
    REPORT_SHARD: "1"

report-tests-3:
  extends: .report-template
  variables:
    REPORT_SHARD: "2"
