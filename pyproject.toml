[project]
name = "lotty-ab-platform"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = ["ruff>=0.8.0"]

[tool.ruff]
target-version = "py312"
line-length = 99
src = ["backend"]
exclude = [".venv", "__pycache__", "logs"]

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "C4",
    "UP",
]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
