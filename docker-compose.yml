services:
  postgres:
    image: postgres:16-alpine
    container_name: prod_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: prod_secret
      POSTGRES_DB: prod
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql
      - ./docker/postgres/learnings_library.sql:/docker-entrypoint-initdb.d/02-learnings_library.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d prod"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: prod_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PASSWORD: prod_secret
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      ADMIN_FIRST_NAME: ${ADMIN_FIRST_NAME:-Admin}
      LEARNINGS_REQUIRED_ON_COMPLETE: ${LEARNINGS_REQUIRED_ON_COMPLETE:-true}
    ports:
      - "80:80"
    volumes:
      - backend_logs:/app/logs

  tests:
    build:
      context: .
      dockerfile: Dockerfile.tests
    environment:
      API_BASE_URL: http://backend:80
      DB_HOST: postgres
      DB_USER: user
      DB_PASSWORD: prod_secret
      DB_NAME: prod
      LEARNINGS_REQUIRED_ON_COMPLETE: ${LEARNINGS_REQUIRED_ON_COMPLETE:-true}
    depends_on:
      backend:
        condition: service_started
      postgres:
        condition: service_healthy
    command: ["sh", "-c", "python /app/tests/seed_test_data.py && pytest /app/tests/ -s"]
    profiles: ["test"]

volumes:
  postgres_data:
  backend_logs:
